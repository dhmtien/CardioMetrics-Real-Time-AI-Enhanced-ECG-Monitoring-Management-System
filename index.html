<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioMetrics - Realtime Heart Dashboard</title>
    
    <!-- Cấu hình Giao diện tĩnh (Phông nền sân khấu) -->
    <!-- Tailwind CSS (Dùng CDN cho môi trường phát triển nhanh, có thể bỏ nếu Vite đã cài Tailwind cục bộ) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0B0F19',
                        cardBg: '#1A1F2C',
                        primary: '#3B82F6',
                        accent: '#8B5CF6',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS Cơ sở cho toàn bộ ứng dụng */
        body {
            background-color: #0B0F19;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Tùy chỉnh thanh cuộn toàn cầu */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0B0F19; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- VUE APP MOUNT POINT (App.vue sẽ được chèn vào đây) -->
    <div id="app"></div>
    
    <!-- Entry point của Vite -->
    <script type="module" src="/src/main.js"></script>

</body>
</html>
